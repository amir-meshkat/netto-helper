<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Side income as a zzp'er next to a salary: what you keep, how much to set aside for tax, and which partner should earn it." />
    <title>Side income as a zzp'er | Netto Helper</title>
    <script type="module" src="/src/pages/side-income/main.ts"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="site-header" id="site-header"></header>
      <main>
        <h1 class="page-title" id="page-title"></h1>
        <p class="page-intro" id="page-intro"></p>
        <div class="tool-layout">
          <section class="card area-answer" id="answer-card"><div id="answer" aria-live="polite"></div></section>
          <section class="card area-inputs" aria-labelledby="inputs-title">
            <h2 id="inputs-title"></h2>
            <div id="inputs"></div>
          </section>
          <div class="area-results stack" id="results">
            <section class="card" id="reason"></section>
            <section class="card" id="set-aside"></section>
            <section class="card" id="chart-card" aria-labelledby="chart-title">
              <h2 id="chart-title"></h2>
              <p class="card-sub" id="chart-sub"></p>
              <ul class="chart-legend" id="chart-legend"></ul>
              <div id="chart"></div>
              <details class="why" data-key="chart-table">
                <summary id="table-toggle"></summary>
                <div id="chart-table"></div>
              </details>
            </section>
          </div>
        </div>
      </main>
      <footer class="site-footer" id="site-footer"></footer>
    </div>
    <button type="button" class="mini-answer" id="mini" hidden></button>
  </body>
</html>
